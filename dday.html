<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>디데이 위젯 | 요이위젯</title>
<meta name="description" content="노션에 임베드하는 귀여운 픽셀 고양이 디데이 위젯 — 요이위젯">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div class="widget">
  <canvas id="cv"></canvas>
  <div class="big" id="dday">D-?</div>
  <div class="title" id="title"></div>
</div>
<script type="module">
import { Pet, qs, computeScale, setupPage } from "./engine.js";
setupPage();

const RESERVE = 60;
const pet = new Pet(document.getElementById("cv"), { scale: computeScale(RESERVE) });

let rt;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => pet.setScale(computeScale(RESERVE)), 150);
});

document.getElementById("title").textContent = qs("title", "");

let celebrating = null;
function render() {
  const raw = qs("date", null);
  const el = document.getElementById("dday");
  const target = new Date(raw + "T00:00:00");
  // ISO 파싱은 13월·2월 30일 같은 범위 밖 날짜를 Invalid Date로 거부한다
  if (!raw || !/^\d{4}-\d{2}-\d{2}$/.test(raw) || isNaN(target)) {
    el.textContent = "날짜를 설정하세요";
    el.style.fontSize = "14px";
    return;
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((target - today) / 86400000);
  el.textContent = diff > 0 ? `D-${diff}` : diff === 0 ? "D-DAY" : `D+${-diff}`;

  // 디데이 당일엔 하루 종일 축하
  if (diff === 0) {
    el.style.color = "var(--accent)";
    if (!celebrating) celebrating = setInterval(() => pet.poke(), 2500);
  } else {
    el.style.color = "";
    if (celebrating) { clearInterval(celebrating); celebrating = null; }
  }
}
render();
setInterval(render, 60000); // 자정 넘어가면 갱신
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
</html>
