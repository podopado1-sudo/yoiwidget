<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디데이 위젯</title>
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div class="widget">
  <canvas id="cv"></canvas>
  <div class="big" id="dday">D-?</div>
  <div class="title" id="title"></div>
</div>
<script type="module">
import { Pet, qs, setupPage } from "./engine.js";
setupPage();

const scale = Number(qs("s", 0)) ||
  Math.max(4, Math.min(8, Math.floor(Math.min(innerWidth, innerHeight - 60) / 22)));
new Pet(document.getElementById("cv"), { scale });

document.getElementById("title").textContent = qs("title", "");

function render() {
  const raw = qs("date", null);
  const el = document.getElementById("dday");
  if (!raw || !/^\d{4}-\d{2}-\d{2}$/.test(raw)) { el.textContent = "날짜를 설정하세요"; el.style.fontSize = "14px"; return; }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const target = new Date(raw + "T00:00:00");
  const diff = Math.round((target - today) / 86400000);
  el.textContent = diff > 0 ? `D-${diff}` : diff === 0 ? "D-DAY" : `D+${-diff}`;
}
render();
setInterval(render, 60000); // 자정 넘어가면 갱신
</script>
</body>
</html>
