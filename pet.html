<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀 펫 위젯</title>
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div class="widget">
  <canvas id="cv"></canvas>
  <div class="title" id="name" hidden></div>
</div>
<script type="module">
import { Pet, qs, setupPage } from "./engine.js";
setupPage();

const scale = Number(qs("s", 0)) ||
  Math.max(4, Math.min(10, Math.floor(Math.min(innerWidth, innerHeight) / 22)));
new Pet(document.getElementById("cv"), { scale });

const name = qs("name", "");
if (name) {
  const el = document.getElementById("name");
  el.textContent = name;
  el.hidden = false;
}
</script>
</body>
</html>
