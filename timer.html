<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>뽀모도로 타이머 위젯 | 요이위젯</title>
<meta name="description" content="노션에 임베드하는 귀여운 픽셀 고양이 뽀모도로 타이머 위젯 — 요이위젯">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div class="widget">
  <canvas id="cv"></canvas>
  <div class="big" id="time">25:00</div>
  <div class="title" id="mode">같이 집중해요!</div>
  <div class="controls">
    <button id="startBtn" class="primary">시작</button>
    <button id="resetBtn">리셋</button>
  </div>
</div>
<script type="module">
import { Pet, qs, computeScale, setupPage } from "./engine.js";
setupPage();

function minutes(name, dflt, max) {
  const n = Number(qs(name, dflt));
  return Number.isFinite(n) ? Math.min(max, Math.max(1, n)) : dflt;
}
const WORK = minutes("w", 25, 180) * 60;
const BREAK = minutes("b", 5, 60) * 60;

const RESERVE = 90;
const pet = new Pet(document.getElementById("cv"), { scale: computeScale(RESERVE, 2) });

let rt;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => pet.setScale(computeScale(RESERVE, 2)), 150);
});

const timeEl = document.getElementById("time");
const modeEl = document.getElementById("mode");
const startBtn = document.getElementById("startBtn");

let mode = "work";          // work | break
let remaining = WORK;
let running = false;
let last = null;

// 노션은 iframe을 수시로 리마운트한다 — 진행 중인 뽀모도로를 localStorage에 보존.
// 샌드박스 환경에서 localStorage 접근이 throw할 수 있어 전부 try로 감싼다.
const KEY = "yoi-timer:" + location.search;
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} }
};
function save() { store.set({ mode, running, remaining, savedAt: Date.now() }); }

function fmt(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function render() {
  timeEl.textContent = fmt(Math.max(0, remaining));
  modeEl.textContent = mode === "work"
    ? (running ? "집중하는 중..." : "같이 집중해요!")
    : "쉬는 시간 zZ";
  startBtn.textContent = running ? "일시정지" : "시작";
}

function switchMode(next) {
  mode = next;
  remaining = next === "work" ? WORK : BREAK;
  pet.forceSleep(next === "break" && running);
}

// 백그라운드 스로틀링으로 한 번에 여러 구간이 지났어도 초과분을 이월한다
function rollover() {
  pet.poke();
  while (remaining <= 0) {
    const carry = remaining;
    switchMode(mode === "work" ? "break" : "work");
    remaining += carry;
  }
}

// 저장된 상태 복원
const saved = store.get();
if (saved && (saved.mode === "work" || saved.mode === "break") && Number.isFinite(saved.remaining)) {
  mode = saved.mode;
  remaining = saved.remaining;
  running = !!saved.running;
  if (running) {
    remaining -= (Date.now() - saved.savedAt) / 1000;
    last = Date.now();
    if (remaining <= 0) rollover();
    pet.forceSleep(mode === "break" && running);
  }
}

let lastSave = 0;
setInterval(() => {
  if (running) {
    const now = Date.now();
    remaining -= (now - last) / 1000;
    last = now;
    if (mode === "work") pet.lastInteract = now; // 집중 중엔 졸지 않기
    if (remaining <= 0) rollover();
    if (now - lastSave > 5000) { save(); lastSave = now; }
  }
  render();
}, 250);

startBtn.addEventListener("click", () => {
  running = !running;
  last = Date.now();
  pet.forceSleep(mode === "break" && running);
  save();
  render();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  running = false;
  pet.forceSleep(false);
  mode = "work";
  remaining = WORK;
  save();
  render();
});

render();
</script>
</body>
</html>
